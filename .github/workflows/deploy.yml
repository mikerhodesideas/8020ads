name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          # Retry the download: a dropped connection to npm (ECONNRESET) once failed a deploy
          # and emailed Mike about a blip (2026-10-20). Three tries, 20s apart.
          for i in 1 2 3; do npm ci && break; [ "$i" = 3 ] && exit 1; echo "npm ci failed (try $i), retrying in 20s"; sleep 20; done
      - name: Build static export
        run: npx next build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=8020skill --branch=production
